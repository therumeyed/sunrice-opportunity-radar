envVarGroups:
  - name: sunrice-radar-secrets
    envVars:
      # The whole dashboard's login-wall password (HTTP Basic Auth, see
      # server.js's requireSitePassword) -- sync: false so Render prompts
      # for a real value at deploy time rather than defaulting to blank;
      # the app fails closed (no access at all) if this is ever unset.
      - key: SITE_PASSWORD
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: DATAFORSEO_DAILY_COST_CEILING_USD
        value: "5"
      - key: APIFY_TOKEN
        sync: false
      - key: FEATURE_APIFY_REDDIT
        value: "true"
      - key: FEATURE_APIFY_TIKTOK
        value: "true"
      - key: FEATURE_APIFY_INSTAGRAM
        value: "true"
      - key: FEATURE_APIFY_PINTEREST
        value: "true"
      - key: FEATURE_LOCAL_VISIBILITY
        value: "false"
      - key: FEATURE_DIGITAL_AVAILABILITY
        value: "false"
      - key: FEATURE_COMPETITOR_PULSE
        value: "false"
      - key: FEATURE_CUSTOMER_VOICE
        value: "false"
      - key: APIFY_REDDIT_SUBREDDITS
        value: MealPrepSunday,EatCheapAndHealthy,AskCulinary,budgetfood,AskAnAustralian
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: EDITOR_TOKEN
        generateValue: true
      # Stage 3 (IMPLEMENTATION_CHECKLIST.md): optional. Leave blank and the
      # Source health tab honestly shows email alerts as unconfigured --
      # in-app alerts work regardless. Set all three via a Resend account to
      # enable real email notifications.
      - key: ALERT_EMAIL_API_KEY
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: ALERT_EMAIL_FROM
        sync: false

services:
  - type: web
    name: sunrice-radar-dashboard
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - fromGroup: sunrice-radar-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: sunrice-radar-db
          property: connectionString

  - type: cron
    name: sunrice-radar-ingest
    runtime: node
    plan: starter
    # 20:00 UTC = 6am AEST (Melbourne, UTC+10) / 7am AEDT. Adjust by an hour
    # at each daylight-saving change -- Render cron is UTC-only.
    schedule: "0 20 * * *"
    buildCommand: npm install
    startCommand: node src/ingest.js
    envVars:
      - fromGroup: sunrice-radar-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: sunrice-radar-db
          property: connectionString

databases:
  - name: sunrice-radar-db
    plan: basic-1gb
    databaseName: sunrice_radar
    user: sunrice_radar
